name: Retrain F5 model

# Retrains the First-5-innings money-line model and commits the refreshed
# server/data/f5_model.json. Render's autoDeploy then redeploys the backend,
# so the live High Contact tab serves the new model — no manual steps.
on:
  schedule:
    - cron: "0 11 * * 1"      # Mondays 11:00 UTC
  workflow_dispatch: {}        # manual "Run workflow" button

# Allow the default token to commit the refreshed model back to the repo.
permissions:
  contents: write

concurrency:
  group: train-f5
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Reuse past-season pitcher game logs across runs (the live season is
      # always refetched by the collector, so this stays correct).
      - name: Cache MLB game logs
        uses: actions/cache@v4
        with:
          path: ml/cache
          key: f5-mlb-cache-v1

      - name: Install deps
        run: pip install -r ml/requirements.txt

      - name: Collect dataset
        run: python ml/collect_mlb_f5.py

      - name: Train + export model
        run: python ml/train_f5.py

      - name: Commit refreshed model (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/data/f5_model.json server/data/f5_feature_spec.json
          if git diff --staged --quiet; then
            echo "No model change."
          else
            git commit -m "chore(ml): weekly F5 model retrain [skip ci]"
            git push
          fi
